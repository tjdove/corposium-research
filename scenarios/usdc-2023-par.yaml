# USDC March-2023 replay with a constant par reference (Story 5.1, par-reference replay).
# Identical to scenarios/usdc-2023.yaml (untouched; read its header for every other
# parameter, the timestamps and the fits) except:
#   - name: usdc-2023-par
#   - environment: price_series_path removed; base_price 1.0, volatility_per_step 0.0,
#     no mean_reversion_per_step. The reference is constant at 1.0 every step
#     (price_process.py: no series, sigma 0 and kappa 0 leave the price at base_price and
#     draw nothing from ctx.rng). Nothing from the observed USDC/USD series enters the run;
#     the series is used only to evaluate it (scripts/replay_table.py, the overlay figure).
# What this changes: the oracle publishes 1.0 throughout, so the arbitrageur (which trades
# the AMM against the oracle) buys whenever the AMM is below 1.0 by more than its band,
# instead of below the observed price. The holder's entry test is against
# redemption.peg_price (ADR-0021, ADR-0024), not the oracle, so the holder is unaffected.
# Attacker, holder (single 2% entry, C* 9,166,667), arbitrageur, defender, capacity schedule, max_steps and
# seed are unchanged. Nothing is re-fitted (Story 5.1 AC 6).
version: 1
name: usdc-2023-par
seed: 42
steps:
  interval_seconds: 12
  max_steps: 33600
assets:
  - { symbol: STABLE, decimals: 18 }
  - { symbol: REF, decimals: 18 }
amm:
  reserve_stable: 16_666_667
  reserve_reference: 16_666_667
  fee_bps: 1
oracle:
  heartbeat_steps: 6900
  deviation_threshold_pct: 0.25
redemption:
  reserves: 138_107_417
  spread_bps: 0
  capacity_per_step: 605.79
  peg_price: 1.0
  capacity_schedule:
    # 138,107,417 / 7,200 = 19,181.59: the whole reserve could be paid in one day, so any
    # payable queue clears within a day of the reopening
    - { step: 25500, capacity_per_step: 19181.59 }
environment:
  base_price: 1.0
  volatility_per_step: 0.0
  shocks: []
agents:
  - { type: attacker, id: attacker-1, capital: 11_540_596, start_step: 8100, pace: 0.002 }
  - { type: arbitrageur, id: arb-1, capital: 200_000, min_profit_bps: 20, latency_steps: 1 }
  - { type: defender, id: defender-1, budget: 41_346_974, threshold_pct: 99.0, spend_pace: 0.2 }
  - type: holder
    id: holder-1
    capital: 9_166_667
    entry_discount_pct: 2.0
    pace: 0.05
    redeem_when_capacity: true
termination:
  reserves_exhausted: true
  max_steps: true
metrics:
  record_every: 1
  trace_decisions: false
  checkpoint_every: 6900
