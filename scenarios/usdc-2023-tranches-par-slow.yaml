# USDC March-2023 replay, par reference, ladder B, weekend redemption channel at 10% of
# calibrated (Story 5.5). Identical to scenarios/usdc-2023-tranches-par.yaml (untouched;
# read its header and scenarios/usdc-2023-tranches.yaml's for every other parameter) except:
#   - name: usdc-2023-tranches-par-slow
#   - redemption.capacity_per_step: 60.579 (10% of the calibrated 605.79) from step 0 until
#     the step-25,500 (85 h) reopening, whose 19,181.59/step is unchanged.
# Question (F-16, referee §5.15): is the two-day plateau a redemption-throughput story?
version: 1
name: usdc-2023-tranches-par-slow
seed: 42
steps:
  interval_seconds: 12
  max_steps: 33600
assets:
  - { symbol: STABLE, decimals: 18 }
  - { symbol: REF, decimals: 18 }
amm:
  reserve_stable: 16_666_667
  reserve_reference: 16_666_667
  fee_bps: 1
oracle:
  heartbeat_steps: 6900
  deviation_threshold_pct: 0.25
redemption:
  reserves: 138_107_417
  spread_bps: 0
  capacity_per_step: 60.579
  peg_price: 1.0
  capacity_schedule:
    # 138,107,417 / 7,200 = 19,181.59: the whole reserve could be paid in one day, so any
    # payable queue clears within a day of the reopening
    - { step: 25500, capacity_per_step: 19181.59 }
environment:
  base_price: 1.0
  volatility_per_step: 0.0
  shocks: []
agents:
  - { type: attacker, id: attacker-1, capital: 11_540_596, start_step: 8100, pace: 0.002 }
  - { type: arbitrageur, id: arb-1, capital: 200_000, min_profit_bps: 20, latency_steps: 1 }
  - { type: defender, id: defender-1, budget: 41_346_974, threshold_pct: 99.0, spend_pace: 0.2 }
  - type: holder
    id: holder-1
    capital: 10_833_333
    tranches:
      - { entry_discount_pct: 2.0, share: 0.25 }
      - { entry_discount_pct: 5.0, share: 0.25 }
      - { entry_discount_pct: 10.0, share: 0.25 }
      - { entry_discount_pct: 20.0, share: 0.25 }
    pace: 0.05
    redeem_when_capacity: true
termination:
  reserves_exhausted: true
  max_steps: true
metrics:
  record_every: 1
  trace_decisions: false
  checkpoint_every: 6900
