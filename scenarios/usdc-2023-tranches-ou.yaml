# USDC March-2023 replay with the calm mean-reverting reference (Story 5.1 AC 2,
# sensitivity check; the par pair, scenarios/usdc-2023-tranches-par.yaml, is the primary result).
# Identical to scenarios/usdc-2023-tranches.yaml (untouched; read its header for every other
# parameter, the timestamps and the fits) except:
#   - name: usdc-2023-tranches-ou
#   - environment: price_series_path removed; the calibrated-baseline-ou reference
#     instead: base_price 1.0, volatility_per_step 3.086e-05, mean_reversion_per_step
#     0.001634 (both from scenarios/calibrated-baseline-ou.yaml; sigma from the calm week
#     27 Feb - 3 Mar 2023, kappa fitted on that week by scripts/fit_reversion.py, Story
#     3.6). seed 42, so the reference path is one seeded draw. Nothing from the March
#     10-13 stress series enters the run.
# What this changes: the oracle follows a calm OU path around 1.0 (sd ~5 bps), so the
# arbitrageur trades against it instead of the observed price. The holder's entry test
# is against redemption.peg_price (ADR-0021, ADR-0024), not the oracle: unaffected.
# Attacker, holder (ladder B, C* 10,833,333), arbitrageur, defender, capacity schedule,
# max_steps and seed are unchanged. Nothing is re-fitted (Story 5.1 AC 6).
version: 1
name: usdc-2023-tranches-ou
seed: 42
steps:
  interval_seconds: 12
  max_steps: 33600
assets:
  - { symbol: STABLE, decimals: 18 }
  - { symbol: REF, decimals: 18 }
amm:
  reserve_stable: 16_666_667
  reserve_reference: 16_666_667
  fee_bps: 1
oracle:
  heartbeat_steps: 6900
  deviation_threshold_pct: 0.25
redemption:
  reserves: 138_107_417
  spread_bps: 0
  capacity_per_step: 605.79
  peg_price: 1.0
  capacity_schedule:
    # 138,107,417 / 7,200 = 19,181.59: the whole reserve could be paid in one day, so any
    # payable queue clears within a day of the reopening
    - { step: 25500, capacity_per_step: 19181.59 }
environment:
  base_price: 1.0
  volatility_per_step: 3.086e-05
  mean_reversion_per_step: 0.001634
  shocks: []
agents:
  - { type: attacker, id: attacker-1, capital: 11_540_596, start_step: 8100, pace: 0.002 }
  - { type: arbitrageur, id: arb-1, capital: 200_000, min_profit_bps: 20, latency_steps: 1 }
  - { type: defender, id: defender-1, budget: 41_346_974, threshold_pct: 99.0, spend_pace: 0.2 }
  - type: holder
    id: holder-1
    capital: 10_833_333
    tranches:
      - { entry_discount_pct: 2.0, share: 0.25 }
      - { entry_discount_pct: 5.0, share: 0.25 }
      - { entry_discount_pct: 10.0, share: 0.25 }
      - { entry_discount_pct: 20.0, share: 0.25 }
    pace: 0.05
    redeem_when_capacity: true
termination:
  reserves_exhausted: true
  max_steps: true
metrics:
  record_every: 1
  trace_decisions: false
  checkpoint_every: 6900
