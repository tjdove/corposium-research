# Policy spread-only: at -1.0% the defender widens the redemption spread by 200 bps and never buys on the AMM.
# Story 3.2. Identical to scenarios/calibrated-baseline.yaml (whose header sources every
# value; judgment calls in ADR-0018..0024) except `name` and the defender block. Run in
# sweeps/policy-comparison-mc.yaml through its `base_axis`.
version: 1
name: policy-spread-only
seed: 42
steps:
  interval_seconds: 12
  max_steps: 18000
assets:
  - { symbol: STABLE, decimals: 18 }
  - { symbol: REF, decimals: 18 }
amm:
  reserve_stable: 16_666_667
  reserve_reference: 16_666_667
  fee_bps: 1
oracle:
  heartbeat_steps: 6900
  deviation_threshold_pct: 0.25
redemption:
  reserves: 138_107_417
  spread_bps: 0
  capacity_per_step: 605.79
  peg_price: 1.0
environment:
  base_price: 1.0
  volatility_per_step: 3.086e-05
  shocks: []
agents:
  - { type: attacker, id: attacker-1, capital: 11_540_596, start_step: 50, pace: 0.1 }
  - { type: arbitrageur, id: arb-1, capital: 200_000, min_profit_bps: 20, latency_steps: 1 }
  - type: defender
    id: defender-1
    budget: 41_346_974
    threshold_pct: 1.0
    spend_pace: 0.2
    spread_adjust_bps: 200
    buy: false
  - type: holder
    id: holder-1
    capital: 9_166_667
    entry_discount_pct: 2.0
    pace: 0.05
    redeem_when_capacity: true
termination:
  reserves_exhausted: true
  peg_recovered: { for_steps: 6900, tolerance: 0.0031 }
  max_steps: true
metrics:
  record_every: 1
  trace_decisions: false
  checkpoint_every: 6900
