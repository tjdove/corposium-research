[project]
name = "depeg-sim"
version = "0.1.0"
description = "Corposium Research — stablecoin depeg simulator modeled on the 1992 Soros/ERM event"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Tim Dove", email = "timdoveemail@yahoo.com" }]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/tjdove/corposium-research"
Repository = "https://github.com/tjdove/corposium-research"

[project.scripts]
depeg = "depeg_sim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/depeg_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
# ruff 0.16 also formats Python blocks inside Markdown; story files are specs, not code.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
